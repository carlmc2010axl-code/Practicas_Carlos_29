<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-eidth, initial-scale=1.0">
    <title>Resta</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

<header class="encabezado">
    <h1>Calculadora basica con flask</h1>

    <nav class="menu">
        <a href="/suma">suma</a>
        <a href="/resta">Resta</a>
        <a href="/multiplicacion">Multiplicacion</a>
        <a href="/division">Division</a>
    </nav>
</header>

<main class="contenetor">
    <section class="tarjeta-operacion"></section>
        <h2>Resta</h2>
        <form method="POST">
            <label for="numero1">Primer número</label>
            <input id="numero1" name="numero1"
                    type="number" step="any" required>

            <label for="numero2">Segundo número</label>
            <input id="numero2" name="numero2"
                   type="number" step="any" required>

            <button class="boton" type="submit">
                Calcular resta
            </button>
        </form>

        {% if resultado is not none %}
            <p class="resultado">
                Resultado: {{ resultado }}
            </p>
        {% endif %}
    </section>
</main>

</main>

</body>
</html>
