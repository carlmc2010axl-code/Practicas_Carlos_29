<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área y Perímetro de un Círculo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            padding: 50px;
        }

        .circulo {
            width: 150px;
            height: 150px;
            background-color: #3498db;
            border-radius: 50%;
            margin: 20px auto;
        }

        .calculadora {
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            width: 300px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        input, button {
            padding: 10px;
            margin: 8px;
            font-size: 16px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #217dbb;
        }
    </style>
</head>

<body>

    <h1>Círculo</h1>

    <div class="circulo"></div>

    <div class="calculadora">
        <h2>Calculadora</h2>

        <label>Radio:</label>
        <input type="number" id="radio" placeholder="Ingresa el radio">

        <br>

        <button onclick="calcular()">Calcular</button>

        <h3 id="resultado"></h3>
    </div>

    <script>
        function calcular() {
            let radio = parseFloat(document.getElementById("radio").value);

            if (radio <= 0 || isNaN(radio)) {
                document.getElementById("resultado").innerHTML =
                    "Ingresa un radio válido.";
                return;
            }

            // Fórmula del área: π × r²
            let area = Math.PI * radio * radio;

            // Fórmula del perímetro: 2 × π × r
            let perimetro = 2 * Math.PI * radio;

            document.getElementById("resultado").innerHTML =
                "Área: " + area.toFixed(2) + "<br>" +
                "Perímetro: " + perimetro.toFixed(2);
        }
    </script>

</body>
</html>
